<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#3a2a1f"/>
      <stop offset="1" stop-color="#140e0a"/>
    </radialGradient>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1e4c0"/>
      <stop offset="1" stop-color="#d9c493"/>
    </linearGradient>
    <radialGradient id="wax" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#d23a2e"/>
      <stop offset="0.6" stop-color="#9c1c17"/>
      <stop offset="1" stop-color="#5e0d0b"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3d27a"/>
      <stop offset="1" stop-color="#a87a2a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- ground and gold frame -->
  <rect x="0" y="0" width="512" height="512" fill="url(#bg)"/>
  <rect x="22" y="22" width="468" height="468" rx="60" fill="none" stroke="url(#gold)" stroke-width="10"/>

  <!-- ledger page -->
  <g transform="rotate(-7 230 236)" filter="url(#shadow)">
    <rect x="96" y="78" width="268" height="320" rx="10" fill="url(#page)"/>
    <line x1="134" y1="96" x2="134" y2="382" stroke="#b5352b" stroke-width="4"/>
    <g stroke="#b49f6c" stroke-width="3">
      <line x1="112" y1="136" x2="348" y2="136"/>
      <line x1="112" y1="182" x2="348" y2="182"/>
      <line x1="112" y1="228" x2="348" y2="228"/>
      <line x1="112" y1="274" x2="348" y2="274"/>
      <line x1="112" y1="320" x2="348" y2="320"/>
    </g>
    <!-- ink entries: a name and an amount on each line, the last one struck through -->
    <g stroke="#2b1d14" stroke-width="7" stroke-linecap="round">
      <line x1="150" y1="122" x2="248" y2="122"/><line x1="290" y1="122" x2="334" y2="122"/>
      <line x1="150" y1="168" x2="226" y2="168"/><line x1="296" y1="168" x2="334" y2="168"/>
      <line x1="150" y1="214" x2="262" y2="214"/><line x1="284" y1="214" x2="334" y2="214"/>
    </g>
  </g>

  <!-- wax seal with skull -->
  <g filter="url(#shadow)">
    <path fill="url(#wax)" d="M352 238
      c18 -4 30 10 44 8 c16 -2 28 12 30 28 c2 14 16 22 14 40 c-2 16 -16 22 -18 38
      c-2 18 -18 26 -34 28 c-14 2 -24 16 -42 14 c-16 -2 -24 -16 -40 -20
      c-16 -4 -28 -14 -30 -32 c-2 -14 -14 -26 -10 -42 c4 -16 18 -22 22 -38
      c4 -16 20 -22 36 -24 c10 -2 18 0 28 0 z"/>
    <circle cx="352" cy="332" r="70" fill="none" stroke="#5e0d0b" stroke-width="6" opacity="0.8"/>
    <circle cx="352" cy="332" r="70" fill="none" stroke="#e0584b" stroke-width="2" opacity="0.5" transform="translate(-2 -2)"/>
    <!-- skull -->
    <g fill="#5a0c0a">
      <path d="M352 284 c-30 0 -50 20 -50 46 c0 16 8 28 20 34 l0 14 c0 6 4 9 9 9 l42 0 c5 0 9 -3 9 -9 l0 -14
        c12 -6 20 -18 20 -34 c0 -26 -20 -46 -50 -46 z"/>
    </g>
    <g fill="#c8372c">
      <ellipse cx="334" cy="330" rx="12" ry="13"/>
      <ellipse cx="370" cy="330" rx="12" ry="13"/>
      <path d="M352 344 l-8 14 l16 0 z"/>
      <rect x="333" y="368" width="6" height="14" rx="2"/>
      <rect x="345" y="368" width="6" height="14" rx="2"/>
      <rect x="357" y="368" width="6" height="14" rx="2"/>
      <rect x="369" y="368" width="6" height="14" rx="2"/>
    </g>
  </g>

  <!-- gold coin -->
  <g filter="url(#shadow)">
    <circle cx="150" cy="390" r="52" fill="url(#gold)"/>
    <circle cx="150" cy="390" r="40" fill="none" stroke="#8a6020" stroke-width="5"/>
    <text x="150" y="410" font-family="Georgia, serif" font-size="56" font-weight="bold" fill="#7a521a" text-anchor="middle">g</text>
  </g>
</svg>
